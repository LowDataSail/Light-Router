[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "circumnavigation-2027-router"
version = "0.1.0"
description = "AI-Powered Low-Data Sailing Router for Circumnavigation 2027"
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.10"
authors = [
    {name = "Lilian Bosc", email = "contactlilian3@gmail.com"}
]
keywords = [
    "sailing",
    "routing",
    "ai",
    "weather",
    "grib",
    "circumnavigation",
    "low-data",
    "satellite",
    "navigation"
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Atmospheric Science",
    "Topic :: Scientific/Engineering :: GIS",
    "Topic :: Software Development :: Libraries :: Python Modules",
]
dependencies = [
    "numpy>=1.24.0",
    "pandas>=2.0.0",
    "scipy>=1.10.0",
    "xarray>=2023.0.0",
    "cfgrib>=0.9.10.4",
    "pygrib>=2.1.4",
    "netCDF4>=1.6.0",
    "matplotlib>=3.7.0",
    "seaborn>=0.12.0",
    "plotly>=5.14.0",
    "folium>=0.14.0",
    "shapely>=2.0.0",
    "pyproj>=3.4.0",
]

[project.optional-dependencies]
ai = [
    "scikit-learn>=1.2.0",
    "tensorflow>=2.12.0",
]
dev = [
    "pytest>=7.4.0",
    "black>=23.0.0",
    "flake8>=6.0.0",
    "mypy>=1.0.0",
    "jupyter>=1.0.0",
    "jupyterlab>=4.0.0",
]
performance = [
    "psutil>=5.9.0",
    "memory-profiler>=0.61.0",
]
geospatial = [
    "geopandas>=0.12.0",
    "contextily>=1.3.0",
]
api = [
    "fastapi>=0.95.0",
    "uvicorn>=0.22.0",
    "requests>=2.31.0",
    "pydantic>=2.0.0",
]

[project.urls]
Homepage = "https://github.com/LilianBsc/circumnavigation-2027-router"
Documentation = "https://github.com/LilianBsc/circumnavigation-2027-router#readme"
Repository = "https://github.com/LilianBsc/circumnavigation-2027-router.git"
Issues = "https://github.com/LilianBsc/circumnavigation-2027-router/issues"

[tool.setuptools.packages.find]
where = ["src"]

[tool.black]
line-length = 88
target-version = ["py310", "py311", "py312"]

[tool.pytest.ini_options]
python_files = ["test_*.py", "*_test.py"]
addopts = "-v --tb=short"
testpaths = ["tests"]

[tool.mypy]
python_version = "3.10"
warn_return_any = true
warn_unused_configs = true
ignore_missing_imports = true
